name: publish to npm
on:
  workflow_run:
    workflows: [build]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build run whose tested artifacts should be published
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  publish:
    uses: esportsplus/typescript/.github/workflows/publish-artifacts.yml@main
    with:
      build-run-id: ${{ inputs.build_run_id || format('{0}', github.event.workflow_run.id) }}
      node-version: '26.8.1'
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
