name: publish to npm
on:
  workflow_run:
    workflows: [build]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build run whose tested artifacts should be published
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validate source build
        id: build
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
        with:
          script: |
            const runId = Number(process.env.BUILD_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error('[uws/publish] Invalid build run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId });
            if (run.path !== '.github/workflows/build.yml' || run.head_branch !== 'main' || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('[uws/publish] Publishing requires a successful main-branch build run');
            }
            core.setOutput('run-id', String(runId));
      - name: Download tested revision
        uses: actions/download-artifact@v4
        with:
          name: release-revision
          path: release
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Read tested revision
        id: revision
        run: |
          sha=$(cat release/release-sha.txt)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Download tested binaries
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Publish with npm trusted publishing
        run: npm publish --tag latest
        env:
          # Ignore setup-node's token configuration so npm uses GitHub OIDC.
          NPM_CONFIG_USERCONFIG: /dev/null
          NODE_AUTH_TOKEN: ''
